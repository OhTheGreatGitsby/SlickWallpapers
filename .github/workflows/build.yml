name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh --release

      - uses: actions/upload-artifact@v4
        with:
          name: SlickWallpapers
          path: dist/SlickWallpapers.zip

      # Tags publish a release, unless one was already published by hand.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" dist/SlickWallpapers.zip --title "SlickWallpapers $GITHUB_REF_NAME" --notes-file CHANGELOG.md
